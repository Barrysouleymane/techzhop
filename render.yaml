# Render.com blueprint for the TechZhop API (backend/)
# Render → New → Blueprint → pick this GitHub repo. Then fill the secret values.
services:
  - type: web
    name: techzhop-api
    runtime: node
    rootDir: backend
    plan: free   # "starter" (~7 $/mois) au vrai lancement : ne s'endort pas
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL_LANGUAGE
        value: fr
      - key: RETURN_DAYS
        value: "14"
